name: Build ColorOS 17 for Galaxy M51

on:
  workflow_dispatch:
    inputs:
      donor_url:
        description: "ColorOS 17 Flagship Donor ROM URL (Direct download link to OnePlus 13 PJZ110 zip / payload.bin)"
        required: true
        default: ""
        type: string
      base_url:
        description: "Galaxy M51 Base Vendor: Direct URL or 'auto' to download official M51 stock firmware"
        required: true
        default: "auto"
        type: string
      repack_type:
        description: "Filesystem Type for Repacked Partitions (EROFS or EXT4)"
        required: true
        default: "EROFS"
        type: choice
        options:
          - EROFS
          - EXT4
      enable_ksu:
        description: "Integrate KernelSU / Next-KernelSU into Boot Image"
        required: false
        default: true
        type: boolean
      upload_mirrors:
        description: "Upload ROM to Fast Mirrors (PixelDrain / GoFile)"
        required: false
        default: true
        type: boolean

jobs:
  build-coloros:
    name: Port & Build ColorOS 17 (Galaxy M51)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Maximize Build Space (Free ~65GB Disk)
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true
          echo "=== Cleaned Disk Space ==="
          df -h

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils aria2 brotli curl dos2unix e2fsprogs erofs-utils f2fs-tools \
            gawk git libbrotli-dev liblz4-tool libprotobuf-dev \
            lz4 openjdk-17-jre-headless p7zip-full python3 python3-pip \
            python3-protobuf tar unzip wget xz-utils zstd
          
          # Setup payload-dumper-go
          curl -sSL https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz | tar -xz -C /usr/local/bin payload-dumper-go
          sudo chmod +x /usr/local/bin/payload-dumper-go

          # Setup samloader-rs for official Samsung base downloads
          curl -sSLf "https://github.com/topjohnwu/samloader-rs/releases/download/2.0.0/samloader-v2.0.0-linux-x86_64.tar.xz" | tar -xJ -C /usr/local/bin
          sudo chmod +x /usr/local/bin/samloader

      - name: Setup Porting Toolchain & OTA Utilities
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup_tools.sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Download Base & Donor ROMs
        run: |
          mkdir -p input/donor input/base

          # 1. Download Donor Firmware (OnePlus 13 PJZ110)
          DONOR_URL="${{ inputs.donor_url }}"
          if [[ -n "$DONOR_URL" && "$DONOR_URL" =~ ^https?:// ]]; then
            echo "Downloading OnePlus 13 (PJZ110) ColorOS 17 Flagship Donor from: $DONOR_URL"
            aria2c -x 16 -s 16 -j 4 --continue=true --out="donor_rom.zip" "$DONOR_URL" -d input/donor || \
            wget -c -O input/donor/donor_rom.zip "$DONOR_URL"
          else
            echo "[ERROR] Please provide a valid direct download link to OnePlus 13 ColorOS 17 firmware/payload.bin in donor_url!"
            echo "You can host or mirror your payload.bin or firmware zip on GoFile, PixelDrain, or Google Drive (direct link)."
            exit 1
          fi

          # 2. Download Samsung Galaxy M51 Base Vendor Firmware
          BASE_INPUT="${{ inputs.base_url }}"
          if [[ "$BASE_INPUT" == "auto" || "$BASE_INPUT" == "" ]]; then
            echo "Fetching latest official Samsung Galaxy M51 (SM-M515F) base firmware via samloader..."
            mkdir -p input/base/odin
            ( cd input/base/odin && samloader download --model SM-M515F --region INS )
            FW_ZIP=$(find input/base/odin/ -type f -name "*.zip" | head -n 1)
            if [ -n "$FW_ZIP" ]; then
              echo "Extracting Samsung base package..."
              unzip -q -o "$FW_ZIP" -d input/base/
              rm -f "$FW_ZIP"
            fi
          elif [[ "$BASE_INPUT" =~ ^https?:// ]]; then
            echo "Downloading M51 Base Vendor from URL: $BASE_INPUT"
            aria2c -x 16 -s 16 -j 4 --continue=true --out="base_vendor.tar.xz" "$BASE_INPUT" -d input/base || \
            wget -c -O input/base/base_vendor.tar.xz "$BASE_INPUT"
          fi

      - name: Execute Automated Porting Engine
        env:
          REPACK_TYPE: ${{ inputs.repack_type }}
          ENABLE_KSU: ${{ inputs.enable_ksu }}
        run: |
          ./scripts/port_coloros.sh

      - name: Package Dynamic Super & Flashable ZIP
        run: |
          ./scripts/make_super.sh

      - name: Upload Flashable ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-M51-Flashable-ROM
          path: |
            out/ColorOS17_M51_*.zip
            out/ColorOS17_M51_*.md5
            out/ColorOS17_M51_*.sha256
          compression-level: 0
          retention-days: 7

      - name: Upload ROM to Mirrors (PixelDrain & GoFile)
        if: ${{ inputs.upload_mirrors }}
        continue-on-error: true
        run: |
          ROM_ZIP=$(find out/ -name "ColorOS17_M51_*.zip" | head -n 1)
          if [[ -n "$ROM_ZIP" && -f "$ROM_ZIP" ]]; then
            echo "=== Uploading $ROM_ZIP to PixelDrain ==="
            PD_RES=$(curl -s -F "file=@$ROM_ZIP" https://pixeldrain.com/api/file/ || true)
            PD_ID=$(echo "$PD_RES" | grep -oP '(?<="id":")[^"]+' || true)
            if [ -n "$PD_ID" ]; then
              echo "### 🚀 PixelDrain Mirror: https://pixeldrain.com/u/$PD_ID" >> $GITHUB_STEP_SUMMARY
              echo "[SUCCESS] PixelDrain Link: https://pixeldrain.com/u/$PD_ID"
            fi

            echo "=== Uploading $ROM_ZIP to GoFile ==="
            GF_RES=$(curl -s -F "file=@$ROM_ZIP" https://upload.gofile.io/uploadFile || true)
            GF_PAGE=$(echo "$GF_RES" | grep -oP '(?<="downloadPage":")[^"]+' || true)
            if [ -n "$GF_PAGE" ]; then
              echo "### ⚡ GoFile Mirror: $GF_PAGE" >> $GITHUB_STEP_SUMMARY
              echo "[SUCCESS] GoFile Link: $GF_PAGE"
            fi
          fi
