name: Build ColorOS 17 for Galaxy M51

on:
  workflow_dispatch:
    inputs:
      donor_url:
        description: "ColorOS Flagship Donor ROM URL (OnePlus 12 / Find X7 Ultra zip or payload.bin)"
        required: true
        default: "https://oxygenos.oneplus.net/OP12_ColorOS_Latest_Flagship_firmware.zip"
        type: string
      base_url:
        description: "Galaxy M51 Base Vendor Firmware URL (SM7150 / SM-M515F vendor package)"
        required: true
        default: "https://github.com/Arnav3078/UN1CA-SM7150/releases/download/v1.0/m51_base_vendor.tar.xz"
        type: string
      repack_type:
        description: "Filesystem Type for Repacked Partitions (EROFS or EXT4)"
        required: true
        default: "EROFS"
        type: choice
        options:
          - EROFS
          - EXT4
      enable_ksu:
        description: "Integrate KernelSU / Next-KernelSU into Boot Image"
        required: false
        default: true
        type: boolean
      release_rom:
        description: "Create GitHub Release with Flashable ROM"
        required: false
        default: true
        type: boolean
      upload_gofile:
        description: "Upload ROM to GoFile (Direct Download Link)"
        required: false
        default: true
        type: boolean

jobs:
  build-coloros:
    name: Port & Build ColorOS 17 (Galaxy M51)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Maximize Build Space (Free ~65GB Disk)
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true
          echo "=== Cleaned Disk Space ==="
          df -h

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            aria2 brotli curl dos2unix e2fsprogs erofs-utils f2fs-tools \
            gawk git libbrotli-dev liblz4-tool libprotobuf-dev \
            lz4 openjdk-17-jre-headless p7zip-full python3 python3-pip \
            python3-protobuf tar simg2img img2simg unzip wget xz-utils zstd
          
          # Setup payload-dumper-go
          curl -sSL https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz | tar -xz -C /usr/local/bin payload-dumper-go
          sudo chmod +x /usr/local/bin/payload-dumper-go

      - name: Setup Porting Toolchain & OTA Utilities
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup_tools.sh

      - name: Download Base & Donor ROMs
        run: |
          mkdir -p input/donor input/base
          
          echo "Downloading ColorOS Flagship Donor ROM..."
          if [[ "${{ inputs.donor_url }}" =~ ^https?:// ]]; then
            aria2c -x 16 -s 16 -j 4 --continue=true --out="donor_rom.zip" "${{ inputs.donor_url }}" -d input/donor || \
            wget -c -O input/donor/donor_rom.zip "${{ inputs.donor_url }}"
          fi

          echo "Downloading Galaxy M51 Base Vendor Package..."
          if [[ "${{ inputs.base_url }}" =~ ^https?:// ]]; then
            aria2c -x 16 -s 16 -j 4 --continue=true --out="base_vendor.tar.xz" "${{ inputs.base_url }}" -d input/base || \
            wget -c -O input/base/base_vendor.tar.xz "${{ inputs.base_url }}"
          fi

      - name: Execute Automated Porting Engine
        env:
          REPACK_TYPE: ${{ inputs.repack_type }}
          ENABLE_KSU: ${{ inputs.enable_ksu }}
        run: |
          ./scripts/port_coloros.sh

      - name: Package Dynamic Super & Flashable ZIP
        run: |
          ./scripts/make_super.sh

      - name: Upload to GoFile
        if: ${{ inputs.upload_gofile }}
        run: |
          ROM_ZIP=$(find out/ -name "ColorOS17_M51_*.zip" | head -n 1)
          if [[ -n "$ROM_ZIP" && -f "$ROM_ZIP" ]]; then
            echo "Uploading $ROM_ZIP to GoFile..."
            SERVER=$(curl -s https://api.gofile.io/getServer | grep -oP '(?<="server":")[^"]+')
            if [[ -n "$SERVER" ]]; then
              UPLOAD_RESULT=$(curl -F "file=@$ROM_ZIP" "https://${SERVER}.gofile.io/uploadFile")
              DOWNLOAD_PAGE=$(echo "$UPLOAD_RESULT" | grep -oP '(?<="downloadPage":")[^"]+')
              echo "DOWNLOAD_PAGE=$DOWNLOAD_PAGE" >> "$GITHUB_ENV"
              echo "### 🚀 Direct Download Link (GoFile): $DOWNLOAD_PAGE" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Create GitHub Release
        if: ${{ inputs.release_rom }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-ColorOS17-M51-${{ github.run_number }}
          name: "ColorOS 17 Flagship Port for Galaxy M51 (Build #${{ github.run_number }})"
          body: |
            ## ColorOS 17 Flagship Port for Samsung Galaxy M51 (`m51` / `sm7150`)
            
            ### 🌟 Features:
            - **Base**: ColorOS Flagship (Snapdragon 8 Gen 3 Flagship donor).
            - **Animations**: 100% Full Flagship Parallel Processing Animation Engine, Gaussian Blur, Fluid Cloud / Aqua Dynamics, and Lockscreen Depth Effects.
            - **Optimization**: Zero-Lag tuning for Snapdragon 730G — telemetry, heavy profiling daemons, and background bloat stripped without touching animations.
            - **Hardware**: Complete HAL mapping for AMOLED 60Hz display, 7000mAh battery curve, side capacitive fingerprint sensor, sensors, audio, and camera.
            - **Known Issues**: VoLTE not working (standard LTE mobile data, SMS, Wi-Fi, BT fully working).
            
            ${{ env.DOWNLOAD_PAGE && format('**Direct Download (GoFile)**: {0}', env.DOWNLOAD_PAGE) || '' }}
          files: |
            out/ColorOS17_M51_*.zip
            out/ColorOS17_M51_*.md5
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
